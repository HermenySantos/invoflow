<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem ligação · Invoflow</title>
  <style>
    :root { --bg: #FAFAF8; --text: #1c1c1a; --muted: #6b6b66; --accent: #1B4D3E; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161615; --text: #ededea; --muted: #a3a39d; --accent: #7fc8a0; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, sans-serif; padding: 0 16px; }
    main { max-width: 360px; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button { font: inherit; color: #fff; background: var(--accent); border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Sem ligação à internet</h1>
    <p>Os seus recibos estão guardados no servidor. Volte a ligar-se para os ver e carregar novos.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
