version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: invoflow-db
    environment:
      POSTGRES_USER: invoflow
      POSTGRES_PASSWORD: invoflow_dev
      POSTGRES_DB: invoflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
