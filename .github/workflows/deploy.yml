name: Deploy

# Every green CI run on main builds the images and rolls them out to the server.
# The deploy job is skipped until the DEPLOY_HOST secret exists.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/hermenysantos/invoflow-api:${{ steps.tag.outputs.tag }}
            ghcr.io/hermenysantos/invoflow-api:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/hermenysantos/invoflow-web:${{ steps.tag.outputs.tag }}
            ghcr.io/hermenysantos/invoflow-web:latest

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        if: env.DEPLOY_HOST != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Copy stack files
        if: env.DEPLOY_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/backup"
          target: /opt/invoflow
          strip_components: 1
      - name: Roll out
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.images.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd /opt/invoflow
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
            docker compose -f docker-compose.prod.yml --env-file .env pull api web
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build --remove-orphans
            docker logout ghcr.io
            for i in $(seq 1 30); do
              if curl -fsS "https://$(grep ^DOMAIN= .env | cut -d= -f2)/health" >/dev/null; then echo "healthy on $IMAGE_TAG"; exit 0; fi
              sleep 5
            done
            echo "health check failed after deploy" >&2
            docker compose -f docker-compose.prod.yml logs --tail 50 api
            exit 1
