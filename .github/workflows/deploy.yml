name: Deploy

# Images are built and pushed to GHCR only when the repository variable
# CLERK_PUBLISHABLE_KEY is set (Settings > Secrets and variables > Actions >
# Variables) and, after trimming whitespace, starts with pk_live_ (case-sensitive).
# A live key is required. It must be a
# repository variable, not a secret, because the publishable key is baked
# into the frontend bundle.
# When the variable is unset, the images and deploy jobs are skipped (the
# run itself may show as successful/green, not red).
# frontend/scripts/require-clerk-key.mjs would otherwise fail `npm run build`.
# Do not pass NEXT_PUBLIC_DEMO_AUTH=1 on this path.
# The deploy job is skipped until the DEPLOY_HOST secret exists. It uses the
# production environment; required reviewers are a repository setting.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  clerk-key:
    # Skip before a runner starts when this was not a successful same-repo push.
    # workflow_dispatch still checks the key. Expressions cannot trim a variable,
    # so this job records the trimmed value and whether it has the case-sensitive
    # pk_live_ prefix. The image build uses that trimmed value.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.check.outputs.live }}
      key: ${{ steps.check.outputs.key }}
    steps:
      - id: check
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
        run: |
          key="$CLERK_PUBLISHABLE_KEY"
          key="${key#"${key%%[![:space:]]*}"}"
          key="${key%"${key##*[![:space:]]}"}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          case "$key" in
            pk_live_*) echo "live=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "live=false" >> "$GITHUB_OUTPUT" ;;
          esac

  images:
    needs: clerk-key
    # Fork PRs and pull_request runs must never build or deploy. workflow_run's
    # branches filter matches the head branch name, so a fork PR named main
    # would otherwise trigger this job.
    if: ${{ needs.clerk-key.outputs.live == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/hermenysantos/invoflow-api:${{ steps.tag.outputs.tag }}
            ghcr.io/hermenysantos/invoflow-api:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ needs.clerk-key.outputs.key }}
          tags: |
            ghcr.io/hermenysantos/invoflow-web:${{ steps.tag.outputs.tag }}
            ghcr.io/hermenysantos/invoflow-web:latest

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        if: env.DEPLOY_HOST != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Copy stack files
        if: env.DEPLOY_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/apply-caddy.sh,deploy/backup"
          target: /opt/invoflow
          strip_components: 1
          # Write files in place (keep the inode) so the running caddy's bind mount sees the
          # new Caddyfile and apply-caddy.sh can use a zero-downtime reload.
          overwrite: true
      - name: Roll out
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.images.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd /opt/invoflow
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
            # Stray spaces around DOMAIN would break the Caddy site names and redirect.
            sed -i -E 's/^DOMAIN=[[:space:]]*([^[:space:]]*)[[:space:]]*$/DOMAIN=\1/' .env
            # Refuse a broken Caddyfile before anything restarts; the running caddy keeps its config.
            bash apply-caddy.sh validate
            docker compose -f docker-compose.prod.yml --env-file .env pull api web
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build --remove-orphans
            bash apply-caddy.sh apply
            docker logout ghcr.io
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml --env-file .env exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/detailed', timeout=5)" >/dev/null; then echo "ready on $IMAGE_TAG"; exit 0; fi
              sleep 5
            done
            echo "readiness check failed after deploy" >&2
            docker compose -f docker-compose.prod.yml logs --tail 50 api
            exit 1
