name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: poppler for PDF invoice QR tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pytest -q

  ocr-corpus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      OCR_CORPUS: "1"
      OCR_BACKEND: tesseract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: tesseract por+eng and poppler
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-eng poppler-utils
      - name: real OCR over the synthetic corpus
        run: python -m pytest -q -m ocr_corpus
      - name: accuracy report matches the committed file
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- docs/ocr-accuracy.md

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations build the schema the models expect
        run: |
          alembic upgrade head
          alembic check
      - name: Migration 008 round-trips amounts on Postgres
        run: python scripts/check_migration_008.py
      - name: Migration 009 backfills unclassified on Postgres 16
        run: python scripts/check_migration_009.py
      - name: Migration 010 adds the accepted-mismatch flag on Postgres 16
        run: python scripts/check_migration_010.py
      - name: Migration 011 restores an orphaned e-Fatura invoice on Postgres 16
        run: python scripts/check_migration_011.py
      - name: Migrations go down and back up
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEMO_AUTH: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t invoflow-backend backend
      - run: docker build --build-arg NEXT_PUBLIC_DEMO_AUTH=1 -t invoflow-frontend frontend
