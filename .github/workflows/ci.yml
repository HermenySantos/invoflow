name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: poppler for PDF invoice QR tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pytest -q

  ocr-corpus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      OCR_CORPUS: "1"
      OCR_BACKEND: tesseract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: tesseract por+eng and poppler
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-eng poppler-utils
      - name: real OCR over the synthetic corpus
        run: python -m pytest -q -m ocr_corpus
      - name: accuracy report matches the committed file
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- docs/ocr-accuracy.md

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The scripts below hammer one account on purpose to test database locks.
      RATE_LIMIT_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations build the schema the models expect
        run: |
          alembic upgrade head
          alembic check
      - name: Migration 008 round-trips amounts on Postgres
        run: python scripts/check_migration_008.py
      - name: Migration 009 backfills unclassified on Postgres 16
        run: python scripts/check_migration_009.py
      - name: Migration 010 adds the accepted-mismatch flag on Postgres 16
        run: python scripts/check_migration_010.py
      - name: Migration 011 restores an orphaned e-Fatura invoice on Postgres 16
        run: python scripts/check_migration_011.py
      - name: Migration 013 recomputes stale e-Fatura identities on Postgres 16
        run: python scripts/check_migration_013.py
      - name: Migration 014 splits series-case merges on Postgres 16
        run: python scripts/check_migration_014.py
      - name: Parallel deletes of a linked scan restore one AT invoice
        run: python scripts/check_concurrent_delete.py
      - name: Delete overlapping an e-Fatura pull does not deadlock
        run: python scripts/check_delete_vs_pull.py
      - name: Retype overlapping an e-Fatura link does not cross types
        run: python scripts/check_retype_vs_link.py
      - name: Concurrent pulls of a series-case pair keep one row each
        run: python scripts/check_concurrent_pulls.py
      - name: A user-edited AT number keeps both invoices' VAT on Postgres 16
        run: python scripts/check_edited_at_rows.py
      - name: A PATCH during an e-Fatura pull waits for it on Postgres 16
        run: python scripts/check_edit_during_pull.py
      - name: Saving a deleted receipt twice at once does not hang the API on Postgres 16
        run: python scripts/check_missing_document_lock.py
      - name: A hung e-Fatura pull holds the account lock for a bounded time on Postgres 16
        run: python scripts/check_hung_pull.py
      - name: Account-lock waiters share one budget and never stall other accounts on Postgres 16
        run: python scripts/check_lock_storm.py
      - name: Readiness check reports the database on Postgres 16
        run: HEALTH_POSTGRES_URL="$DATABASE_URL" python -m pytest -q tests/test_health_readiness.py
      - name: Migrations go down and back up
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Production config refuses unsafe settings and serves with valid ones on Postgres 16
        run: PRODUCTION_START_DATABASE_URL="$DATABASE_URL" python -m pytest -q tests/test_production_startup.py

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEMO_AUTH: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t invoflow-backend backend
      - run: docker build --build-arg NEXT_PUBLIC_DEMO_AUTH=1 -t invoflow-frontend frontend
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the rollout scripts
        run: shellcheck deploy/apply-caddy.sh deploy/tests/apply-caddy.test.sh deploy/tests/deploy-wiring.test.sh
      - name: Caddy rollout logic (fake docker)
        run: bash deploy/tests/apply-caddy.test.sh
      - name: Deploy workflow validates before it restarts anything
        run: bash deploy/tests/deploy-wiring.test.sh
      - name: Production Caddyfile is valid
        run: |
          for domain in invoflow.pt localhost; do
            docker run --rm -e DOMAIN="$domain" -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
